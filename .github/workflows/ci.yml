name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# A newer push to the same ref makes the run in progress obsolete, so cancel it.
# Never cancel runs on main: every commit there should finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Lint, type-check & test (Python ${{ matrix.python-version }})
    # Every push to any branch of this repository is already tested, so a pull request from
    # one of those branches would run the same commit a second time. Pull requests from
    # forks have no push here, so they are the only ones that run on the pull_request event.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src tests

      - name: Pytest
        run: uv run pytest

      - name: Smoke test the CLI
        run: |
          uv run ripplerack validate examples/mini_datacenter.yaml
          uv run ripplerack impact examples/mini_datacenter.yaml \
            -p orders-ingest -s examples/changes/orders_v1_3_0.yaml --fail-on-breaking
