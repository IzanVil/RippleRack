# Weekly pull requests for what the project depends on. They run the same CI as any other change,
# and nothing is merged without a review.
version: 2

updates:
  # The dependencies in pyproject.toml and the versions pinned in uv.lock. The tools used to
  # develop (linter, type checker, tests) arrive together in one pull request; each dependency
  # that users install arrives alone, because a change to it can change what RippleRack does.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      development-tools:
        patterns:
          - "hypothesis"
          - "mypy"
          - "pytest*"
          - "ruff"
          - "types-*"

  # The actions that the workflows in .github/workflows use.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
