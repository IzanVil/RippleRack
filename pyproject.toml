[project]
name = "ripplerack"
version = "0.2.3"
description = "Local-first datacenter & data pipeline simulator with semantic schema versioning and cascading impact analysis."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "IzanVil", email = "256081782+IzanVil@users.noreply.github.com" }
]
requires-python = ">=3.11"
keywords = ["datacenter", "simulation", "semver", "data-pipelines", "impact-analysis", "schema"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "networkx>=3.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
    "sqlglot>=30.23,<31",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/IzanVil/RippleRack"
Documentation = "https://github.com/IzanVil/RippleRack/tree/main/docs"
Source = "https://github.com/IzanVil/RippleRack"
Issues = "https://github.com/IzanVil/RippleRack/issues"
Changelog = "https://github.com/IzanVil/RippleRack/blob/main/CHANGELOG.md"

[project.scripts]
ripplerack = "ripplerack.cli:app"

[build-system]
requires = ["uv_build>=0.12.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "types-networkx>=3.6.1.20261006",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "action"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PT",
    "C901", "PLR0911", "PLR0912", "PLR0915",  # a function that grows too much must be split
]
ignore = ["B008"]  # Typer relies on function calls in argument defaults.

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-returns = 6
max-branches = 12
max-statements = 50

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["src", "action"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["action"]  # the glue of the GitHub Action is tested as a module
addopts = "-ra"
