name: order_event
version: 1.0.0
fields:
  - {name: event_id, type: string, description: Unique id of the event}
  - {name: sequence, type: integer, nullable: true}
  - {name: occurred_at, type: timestamp}
  - {name: shipped_on, type: date, nullable: true}
  - {name: status, type: string, description: 'One of: pending, paid, refunded, cancelled'}
  - {name: priority, type: integer, nullable: true, description: 'One of: 1, 2, 3'}
  - {name: amount, type: float, description: 'Total, in the order currency'}
  - {name: paid, type: boolean, nullable: true}
  - {name: coupon, type: string, nullable: true}
  - {name: note, type: string, nullable: true, description: Free text note}
  - {name: shipping, type: json}
  - {name: tags, type: json, nullable: true}
  - {name: metadata, type: json, nullable: true}
  - {name: payload, type: json, nullable: true}
  - {name: legacy_id, type: integer, nullable: true, description: Id in the old system}
  - {name: customer, type: json, nullable: true}
