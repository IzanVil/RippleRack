# Copy this file to .github/workflows/ripplerack.yml of a repository that has a datacenter file.
# On every pull request that changes the file it comments what the change breaks downstream, and
# the check fails when a consumer breaks. See docs/ci.md of RippleRack for the options.
name: RippleRack

on:
  pull_request:
    paths:
      - datacenter.yaml          # the file to compare: change it to yours

permissions:
  contents: read
  pull-requests: write           # to post the comment

# A new push to the pull request replaces the run in progress, so two runs never race to comment.
concurrency:
  group: ripplerack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    name: What does this change break?
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: ripplerack
        uses: IzanVil/RippleRack/action@v0.2.2   # a tag or a commit: never a branch
        with:
          head: datacenter.yaml
          fail-on-breaking: "true"               # "false" only comments

      # The outputs are there for the steps that follow, if you want to do more with them.
      - name: Say what was found
        if: always()
        run: echo "severity $SEVERITY, $BROKEN consumer(s) break, $AT_RISK component(s) at risk"
        env:
          SEVERITY: ${{ steps.ripplerack.outputs.severity }}
          BROKEN: ${{ steps.ripplerack.outputs.broken-count }}
          AT_RISK: ${{ steps.ripplerack.outputs.at-risk-count }}
